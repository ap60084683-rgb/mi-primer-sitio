<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red comunitaria - Alerta Sicaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#14532d">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alerta Sicaya">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
</head>
<body class="min-h-screen bg-[var(--suelo)] text-white">

  <header class="flex flex-wrap items-center gap-3 border-b-4 border-[var(--maiz)] bg-[var(--verde)] px-5 py-3">
    <img src="img/logo-sicaya.png" alt="" class="h-11 w-auto rounded" onerror="this.style.display='none'">
    <div class="mr-auto">
      <h1 class="titulo text-lg font-extrabold leading-tight">Red comunitaria</h1>
      <p id="nombre" class="text-sm text-green-100"></p>
    </div>
    <button id="sonido" class="rounded-lg bg-[var(--maiz)] px-3 py-1.5 text-sm font-semibold text-[var(--suelo)]">Activar sonido</button>
    <a href="reporte.html" class="rounded-lg border border-green-200/60 px-3 py-1.5 text-sm font-semibold hover:bg-white/10">Reportar</a>
    <button id="salir" class="rounded-lg border border-green-200/60 px-3 py-1.5 text-sm font-semibold hover:bg-white/10">Salir</button>
  </header>

  <main class="mx-auto flex max-w-3xl flex-col gap-6 px-5 py-6">

    <aside class="rounded-xl border-2 border-[var(--maiz)] bg-[#13241b] p-4 text-sm">
      <p class="font-semibold text-[var(--maiz)]">Antes de acudir</p>
      <p class="mt-1">Avisa a la Policía (<a href="tel:105" class="font-bold underline">105</a>), al SAMU (<a href="tel:106" class="font-bold underline">106</a>) o a los Bomberos (<a href="tel:116" class="font-bold underline">116</a>). No te enfrentes a nadie: ayuda, acompaña, da primeros auxilios o ilumina.</p>
    </aside>

    <p id="error" role="alert" class="rounded-lg bg-red-100 px-4 py-3 text-sm font-medium text-red-900" hidden></p>

    <section class="flex flex-col gap-3">
      <h2 class="titulo text-2xl font-bold">Mapa de alertas abiertas</h2>
      <div id="mapa" class="relative z-0 h-64 w-full overflow-hidden rounded-xl border border-[#1f3a2b]"></div>
    </section>

    <section class="flex flex-col gap-3">
      <h2 class="titulo text-2xl font-bold">Alertas abiertas</h2>
      <ul id="alertas" class="flex flex-col gap-3"></ul>
      <p id="sin-alertas" class="rounded-xl border border-dashed border-[#1f3a2b] p-6 text-green-100/80" hidden>
        No hay alertas abiertas en este momento. Gracias por estar atento.
      </p>
    </section>

  </main>

  <div id="aviso-alerta" role="alert" class="fixed left-1/2 top-4 z-[2000] -translate-x-1/2 rounded-xl bg-[var(--rojo)] px-6 py-3 font-semibold text-white shadow-2xl" hidden></div>

  <script type="module" src="js/comunidad.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
